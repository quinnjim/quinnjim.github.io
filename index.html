<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  NOTE: title and description are duplicated here as real static values
  (not left empty for render.js to fill). Social and search crawlers do
  not execute JavaScript, so anything injected at runtime is invisible
  to them. render.js still overwrites these from content.json:meta at
  load time — keep the two in sync when meta.pageTitle/pageDescription
  change. Same reasoning applies to the og:/twitter: tags below.
-->
<title id="page-title">James Quinn — Staff Software Engineer</title>
<meta id="page-description" name="description" content="James Quinn — Staff Software Engineer specializing in high-throughput distributed systems, reliability, and data integrity at scale.">
<link rel="canonical" href="https://jimquinn.com/">

<!-- Open Graph (LinkedIn, Facebook, Slack, iMessage) -->
<meta property="og:type" content="profile">
<meta property="og:site_name" content="James Quinn">
<meta property="og:url" content="https://jimquinn.com/">
<meta property="og:title" content="James Quinn — Staff Software Engineer">
<meta property="og:description" content="A decade at Google and Bloomberg designing distributed platforms that keep millions of queries per second honest, fast, and correct.">
<meta property="og:image" content="https://jimquinn.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="James Quinn — Staff Software Engineer. Distributed systems, reliability, data integrity.">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="James Quinn — Staff Software Engineer">
<meta name="twitter:description" content="A decade at Google and Bloomberg designing distributed platforms that keep millions of queries per second honest, fast, and correct.">
<meta name="twitter:image" content="https://jimquinn.com/og.png">

<meta name="theme-color" content="#14171A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.png" sizes="180x180" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<noscript>
  <div class="noscript-banner">
    <h1>James Quinn — Staff Software Engineer</h1>
    <p>A decade at Google and Bloomberg designing distributed platforms that
    keep millions of queries per second honest, fast, and correct. Focused on
    high-throughput distributed systems, reliability, and data integrity at scale.</p>
    <p>This page renders its content with JavaScript, which is currently disabled.
    The quickest way to reach me is
    <a href="https://www.linkedin.com/in/james-quinn-18409157/">LinkedIn</a>.</p>
  </div>
</noscript>

<!--
  This page is a content-agnostic template. All resume content lives in
  content.json and is fetched + rendered by render.js at load time.
  See README.md for the content schema and how to edit it.
-->

<nav id="nav">
  <div class="nav-inner">
    <a href="#top" class="nav-brand">JQ<span class="nav-brand-dot">.</span></a>
    <div class="nav-links">
      <a href="#about">about</a>
      <a href="#initiative">ai&nbsp;fluency</a>
      <a href="#experience">experience</a>
      <a href="#skills">skills</a>
      <a href="#contact">contact</a>
    </div>
  </div>
</nav>

<header id="top" class="hero">
  <div class="hero-inner hero-inner-no-photo">
    <div class="hero-text">
      <p class="eyebrow"><span class="status-dot"></span><span id="hero-eyebrow"></span></p>
      <h1 id="hero-name"></h1>
      <p class="hero-sub" id="hero-sub"></p>
      <div class="hero-cta">
        <a href="#experience" class="btn btn-primary">View experience</a>
        <a href="#" id="hero-email-btn" class="btn btn-ghost">Get in touch</a>
      </div>
    </div>
  </div>

  <div class="metrics-strip" id="metrics">
    <!-- metric tiles injected by render.js from content.json:metrics -->
  </div>
</header>

<main>

  <section id="about" class="section">
    <div class="section-inner">
      <p class="section-kicker mono" id="about-kicker"></p>
      <h2 class="section-title" id="about-title"></h2>
      <p class="body-text" id="about-body"></p>
    </div>
  </section>

  <section id="initiative" class="section section-highlight">
    <div class="section-inner">
      <p class="section-kicker mono" id="initiative-kicker"></p>
      <h2 class="section-title" id="initiative-title"></h2>
      <div class="initiative-card">
        <div class="initiative-header">
          <span class="badge" id="initiative-badge"></span>
          <h3 id="initiative-role-title"></h3>
        </div>
        <div id="initiative-paragraphs"></div>
        <div class="initiative-metrics" id="initiative-metrics"></div>
        <p class="body-text body-text-muted" id="initiative-footnote"></p>
      </div>
    </div>
  </section>

  <section id="experience" class="section">
    <div class="section-inner">
      <p class="section-kicker mono" id="experience-kicker"></p>
      <h2 class="section-title" id="experience-title"></h2>
      <div class="timeline" id="timeline">
        <!-- timeline entries injected by render.js from content.json:experience.entries -->
      </div>
    </div>
  </section>

  <section id="skills" class="section">
    <div class="section-inner">
      <p class="section-kicker mono" id="skills-kicker"></p>
      <h2 class="section-title" id="skills-title"></h2>
      <div class="skills-grid" id="skills-grid">
        <!-- skill groups injected by render.js from content.json:skills.groups -->
      </div>
    </div>
  </section>

</main>

<footer id="contact" class="footer">
  <div class="section-inner footer-inner">
    <div class="footer-main">
      <p class="section-kicker mono" id="footer-kicker"></p>
      <h2 class="section-title" id="footer-title"></h2>
      <p class="body-text" id="footer-body"></p>
      <div class="footer-links" id="footer-links">
        <a href="#" id="footer-email" class="footer-link"></a>
        <!-- profile links (LinkedIn etc.) appended by render.js from content.json:meta.links -->
      </div>
    </div>
  </div>
  <div class="footer-bottom">
    <p class="mono">© <span id="year"></span> <span id="footer-name"></span></p>
  </div>
</footer>

<!-- ===== Templates for repeating content blocks ===== -->

<template id="tpl-metric">
  <div class="metric">
    <div class="metric-num mono">0</div>
    <div class="metric-label"></div>
  </div>
</template>

<template id="tpl-initiative-metric">
  <div class="mini-metric">
    <span class="mini-metric-num mono"></span>
    <span class="mini-metric-label"></span>
  </div>
</template>

<template id="tpl-timeline-entry">
  <div class="timeline-entry">
    <div class="timeline-rail">
      <span class="timeline-dot"></span>
      <span class="timeline-line"></span>
    </div>
    <div class="timeline-content">
      <p class="timeline-date mono"></p>
      <h3></h3>
      <p class="timeline-role"></p>
      <div class="role-blocks"></div>
    </div>
  </div>
</template>

<template id="tpl-role-block">
  <div class="role-block">
    <p class="role-title"></p>
    <ul class="body-list"></ul>
  </div>
</template>

<template id="tpl-skill-group">
  <div class="skill-group">
    <p class="skill-group-label"></p>
    <div class="chip-row"></div>
  </div>
</template>

<template id="tpl-chip">
  <span class="chip mono"></span>
</template>

<script src="render.js"></script>
</body>
</html>
